<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>齿轮组选配 · 手摇机械试制</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="top-nav">
      <a href="/" class="active">单台选配</a>
      <a href="/batch">批量装配</a>
      <a href="/procure">缺齿补货</a>
      <a href="/dual-speed">双档换速</a>
      <a href="/lifetime">寿命核算</a>
      <a href="/torque">带载安全</a>
      <a href="/layout">轴位装配</a>
      <a href="/diagnose">转速异常定位</a>
      <a href="/phase-reset">装配校准</a>
      <a href="/resonance">共振避让</a>
      <a href="/backlash">空程预算</a>
      <a href="/reciprocate">往复回放</a>
    </nav>
    <h1>⚙️ 齿轮组选配</h1>
    <p class="subtitle">手摇机械装置试制辅助 · 在 1～3 级传动中寻找满足目标输出转速比的配对方案</p>
  </header>

  <main>
    <form id="search-form" class="card">
      <section>
        <h2>1. 目标参数</h2>
        <div class="grid two">
          <label class="field">
            <span>目标输出转速比（输出 / 输入）</span>
            <input id="target" name="target" value="1/12" placeholder="如 0.0833 或 1/12" required />
            <small>支持小数或分数，例如 1/12、0.0833、4</small>
          </label>
          <label class="field">
            <span>允许相对误差</span>
            <input id="tolerance" name="tolerance" value="5%" placeholder="如 5% 或 0.05" required />
            <small>可填百分数（5%）或小数（0.05）</small>
          </label>
        </div>
      </section>

      <section>
        <div class="section-head">
          <h2>2. 现有齿轮（2～12 枚）</h2>
          <div class="btn-row">
            <button type="button" id="btn-example" class="btn ghost">填入示例</button>
            <button type="button" id="btn-add" class="btn ghost">＋ 添加齿轮</button>
          </div>
        </div>
        <div class="gear-grid-head">
          <span>唯一编号</span><span>齿数</span><span></span>
        </div>
        <div id="gear-rows"></div>
      </section>

      <div class="actions">
        <button type="submit" class="btn primary">开始选配</button>
      </div>

      <p id="form-error" class="alert error" hidden></p>
    </form>

    <section id="result-panel" class="card" hidden>
      <div class="section-head">
        <h2>3. 选配结果</h2>
        <span id="result-summary" class="summary"></span>
      </div>
      <p id="no-solution" class="alert warn" hidden></p>
      <p id="truncated-note" class="muted" hidden></p>
      <div id="result-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <span>实际转速比以精确分数（BigInt）计算 · 排序：级数最少 → 误差最小 → 编号序列</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
